name: ProxForge tests

on:
  push:
    branches:
      - main
      - phase-3/**
      - phase-4/**
      - phase-5/**
      - phase-6/**
      - phase-7/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
      - name: Run hermetic test suite
        run: bash tests/run-tests.sh
