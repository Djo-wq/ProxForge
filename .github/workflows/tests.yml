name: ProxForge tests

on:
  push:
    branches:
      - main
      - phase-3/**
      - phase-4/**
      - phase-5/**
      - phase-6/**
      - phase-7/**
      - phase-8/**
      - phase-9/**
      - phase-10/**
      - phase-11/**
      - chore/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
      - name: Run ShellCheck on Phase 11 entry points
        run: shellcheck --severity=error proxforge.sh scripts/install.sh scripts/uninstall.sh tests/test-install.sh
      - name: Validate Makefile syntax target
        run: make syntax
      - name: Run full lint and hermetic test suite
        run: make check
